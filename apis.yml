aid: apprentice
name: Apprentice
description: >-
  Apprentice (apprentice.io) is an AI-native manufacturing platform for the life
  sciences, delivering Tempo Manufacturing Cloud — a GxP-compliant SaaS suite that
  unifies a Manufacturing Execution System (MES), Laboratory Execution System (LES),
  Augmented Work Instructions (AWI), and the Tandem collaboration/guest layer across
  pharmaceutical, biotech, and cell-and-gene-therapy sites. Tempo digitizes batch
  records, recipe authoring, and quality data from raw materials to finished goods,
  and exposes a RESTful Apprentice Public API (7.4+) for integrating Tempo data and
  metadata with external systems. The platform is SOC 2 Type II and ISO 27001:2022
  certified and validated to FDA 21 CFR Part 11. Backed by ICONIQ Capital. This
  profile was enriched by the API Evangelist pipeline from public surfaces; the
  Public API reference is gated to customers via their delivery lead / CSM.
